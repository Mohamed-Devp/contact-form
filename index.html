<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Contact Form</title>
</head>
<body class="page">
    <main class="page__inner">
        <h1 class="page__heading">Contact Us</h1>
        <form class="form page__form" novalidate>
            <p class="alert u-sr-only" role="alert" aria-live="assertive"></p>
            <div class="form__section u-flex-column">
                <label for="first-name" class="label label_required">First Name</label>
                <input
                    type="text"
                    name="first-name"
                    required
                    id="first-name"
                    class="field"
                    aria-describedby="first-name-error"
                />
                <p id="first-name-error" class="error"></p>
            </div>
            <div class="form__section u-flex-column">
                <label for="last-name" class="label label_required">Last Name</label>
                <input
                    type="text"
                    name="last-name"
                    required
                    id="last-name"
                    class="field"
                    aria-describedby="last-name-error"
                />
                <p id="last-name-error" class="error"></p>
            </div>
            <div class="form__section u-flex-column u-span-row">
                <label for="email" class="label label_required">Email Address</label>
                <input
                    type="email"
                    name="email"
                    required
                    id="email"
                    class="field"
                    aria-describedby="email-error"
                />
                <p id="email-error" class="error"></p>
            </div>
            <fieldset class="form__group u-flex-column u-span-row">
                <legend class="label label_required">Query Type</legend>
                <ul class="options">
                    <li class="options__item">
                        <label for="query-type-1" class="option">
                            <input
                                type="radio"
                                name="query-type"
                                required
                                id="query-type-1"
                                class="radio"
                                aria-describedby="query-type-error"
                            />
                            General Enquiry
                        </label>
                    </li>
                    <li class="options__item">
                        <label for="query-type-2" class="option">
                            <input
                                type="radio"
                                name="query-type"
                                id="query-type-2"
                                class="radio"
                                aria-describedby="query-type-error"
                            />
                            Support Request
                        </label>
                    </li>
                </ul>
                <p id="query-type-error" class="error"></p>
            </fieldset>
            <div class="form__section u-flex-column u-span-row">
                <label for="message" class="label label_required">Message</label>
                <textarea
                    name="message"
                    required
                    minlength="8"
                    id="message"
                    class="field field_type_multiline"
                    aria-describedby="message-error"
                ></textarea>
                <p id="message-error" class="error"></p>
            </div>
            <div class="form__row u-span-row">
                <input
                    type="checkbox"
                    name="consent"
                    required
                    id="consent"
                    class="checkbox u-shrink-0"
                    aria-describedby="consent-error"
                />
                <label for="consent" class="label label_required">I consent to being contacted by the team</label>
            </div>
            <button class="btn u-span-row">Submit</button>
        </form>
        <div class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
